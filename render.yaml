services:
  - type: web
    name: data-with-roots-1
    runtime: python-3.12.7
    branch: R1A3
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    plan: free
